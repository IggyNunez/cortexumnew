    <meta name="description" content="Cortexuum builds proven marketing systems on real performance data. Over $250M in managed ad spend, psychology-based strategy, custom web development, plain-English communication, and results you can measure." />

    <!-- Security headers -->
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests; default-src 'self'; worker-src 'self' blob: * https://elevenlabs.io; child-src 'self' blob: * https://elevenlabs.io https://js.stripe.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https: http:; connect-src 'self' https: http:; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline' https: http:; font-src 'self' data: https:;">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="Strict-Transport-Security" content="max-age=31536000; includeSubDomains; preload">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://cortexuum.com" />
    
    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="Cortexuum | Proven Marketing Systems & Web Development" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cortexuum | Proven Marketing Systems & Web Development" />
    <meta name="twitter:description" content="Psychology-based marketing systems built on real performance data, plus custom web development. Real results for real businesses." />
    
    <!-- Favicon and Web App Manifest -->
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.png" type="image/png" sizes="32x32">
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    
    <!-- Preload critical assets -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>


    <!-- Tab title animation script -->
    <script>
      // Animated tab title with rotating messages
      (function() {
        // Array of messages to display in the tab title
        const messages = [
          "✨ Psychology-Based Marketing",
          "📊 $250M+ in Managed Ad Spend",
          "🚀 Proven Marketing Systems",
          "💼 Media Buying Expertise",
          "🧠 Psychology Meets Performance Data",
          "💰 Superior Marketing Results",
          "🔧 Systems Built on Real Data",
          "⚡ Outperform Traditional Marketing"
        ];
        
        let currentIndex = 0;
        let direction = 1;
        const baseTitle = "Cortexuum";
        
        // Emoji spinner frames
        const spinnerFrames = ["⣾", "⣽", "⣻", "⢿", "⡿", "⣟", "⣯", "⣷"];
        let spinnerIndex = 0;
        
        // Update the title periodically
        setInterval(() => {
          spinnerIndex = (spinnerIndex + 1) % spinnerFrames.length;
          currentIndex = (currentIndex + direction) % messages.length;
          if (currentIndex === 0) direction = 1;
          if (currentIndex === messages.length - 1) direction = -1;
          
          document.title = `${spinnerFrames[spinnerIndex]} ${messages[currentIndex]} | ${baseTitle}`;
        }, 2200);
      })();
    </script>
  </body>
</html>
